<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Pixel Canvas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #f4f4f5; /* Light gray background resembling the image */
            --bg-panel: #ffffff;
            --text-main: #09090b; /* Near black */
            --text-muted: #71717a;
            --border-color: rgba(0, 0, 0, 0.08);
            --accent-color: #000000; /* Primary actions are solid black */
            --accent-hover: #27272a;
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-pill: 9999px;
            --shadow-soft: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
            --cell-size: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background-color: transparent;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: -0.05em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 0 24px 24px 24px;
            gap: 24px;
        }

        .sidebar {
            width: 320px;
            background-color: var(--bg-panel);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding: 24px;
            overflow-y: auto;
            z-index: 5;
            border: 1px solid var(--border-color);
        }

        /* Hide scrollbar for sidebars */
        .sidebar::-webkit-scrollbar { display: none; }
        .sidebar { -ms-overflow-style: none; scrollbar-width: none; }

        .section-title {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
            margin-left: 12px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .row-inputs {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: block;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            background: #fafafa;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--text-main);
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: var(--accent-color);
        }

        /* Base Button Style */
        button {
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-pill);
            background-color: var(--bg-panel);
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            background-color: #f4f4f5;
        }

        /* Header Outline Buttons */
        .header-actions button:not(.primary-btn) {
            border-color: var(--border-color);
            padding: 8px 16px;
        }

        /* Primary Black Button (matching image) */
        button.primary-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
        }

        button.primary-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Danger Button */
        button.danger-btn {
            background-color: #fee2e2;
            color: #dc2626;
            border: none;
            border-radius: var(--radius-sm); /* Keep tool buttons rectangular */
        }

        button.danger-btn:hover {
            background-color: #fecaca;
        }

        /* Tools Grid Buttons */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .tool-btn {
            border-radius: var(--radius-sm);
            padding: 12px;
            background: #fafafa;
            border-color: transparent;
        }

        .tool-btn:hover {
            background: #f4f4f5;
        }

        .tool-btn.active {
            background-color: var(--accent-color);
            color: white;
        }

        button svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .editor-viewport {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-color: #e4e4e7; /* Neutral drawing background */
            border-radius: var(--radius-lg);
            cursor: grab;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
        }

        .editor-viewport::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(#d4d4d8 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
        }

        .editor-viewport.active-drawing { cursor: crosshair; }
        .editor-viewport.active-grabbing { cursor: grabbing; }

        #canvas-transform-container {
            position: absolute;
            transform-origin: 0 0;
            will-change: transform;
            display: inline-block;
            padding: 100px;
        }

        #pixel-canvas {
            display: block;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.15);
            border-radius: 4px;
            user-select: none;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px;
            background: #fafafa;
            border-radius: var(--radius-sm);
        }

        input[type="color"] {
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
            padding: 0;
            overflow: hidden;
            border: 2px solid var(--border-color);
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .palette-color {
            aspect-ratio: 1;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.1);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .palette-color:hover { transform: scale(1.1); }
        .palette-color.active { box-shadow: 0 0 0 2px var(--bg-panel), 0 0 0 4px var(--accent-color); }

        .stats-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 240px;
            overflow-y: auto;
        }

        .stats-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: #fafafa;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .stats-item:hover { background: #f4f4f5; }

        .stats-color-preview {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.1);
            display: inline-block;
            vertical-align: middle;
            margin-right: 12px;
        }

        .status-bar {
            position: absolute;
            bottom: 24px;
            right: 24px;
            background-color: var(--bg-panel);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: var(--radius-pill);
            font-size: 0.8rem;
            font-weight: 500;
            display: flex;
            gap: 20px;
            pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border: 1px solid var(--border-color);
            align-items: center;
        }
        
        /* Modern Checkbox */
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .checkbox-wrapper input[type="checkbox"] {
            accent-color: var(--accent-color);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>
            <span>DIGITAL</span><span style="font-weight: 400; -webkit-text-stroke: 1px var(--text-main); color: transparent;">CRAFTSMAN</span>
        </h1>
        <div class="header-actions">
            <button id="undo-btn" title="Undo">
                <svg viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
                Undo
            </button>
            <button id="redo-btn" title="Redo">
                <svg viewBox="0 0 24 24"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg>
                Redo
            </button>
            <button id="center-btn" title="Center Canvas">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
            </button>
            <button id="export-btn" class="primary-btn">
                Export Work
            </button>
        </div>
    </header>

    <div class="main-container">
        <!-- Left Sidebar -->
        <div class="sidebar">
            <div>
                <div class="section-title">Canvas Setup</div>
                <div class="control-group">
                    <div class="row-inputs">
                        <div style="flex: 1;">
                            <label>Rows</label>
                            <input type="number" id="grid-rows" value="20" min="5" max="100">
                        </div>
                        <span style="color: var(--text-muted); font-weight: 600; padding-top: 18px;">×</span>
                        <div style="flex: 1;">
                            <label>Cols</label>
                            <input type="number" id="grid-cols" value="20" min="5" max="100">
                        </div>
                    </div>
                    <button id="resize-btn" style="width: 100%; border-radius: var(--radius-sm); background: #fafafa;">Apply Size</button>
                </div>
            </div>

            <div>
                <div class="section-title">Tools</div>
                <div class="tools-grid">
                    <button id="pencil-btn" class="tool-btn active">
                        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                        Draw
                    </button>
                    <button id="eraser-btn" class="tool-btn">
                        <svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.5l12-12c1-1 2.5-1 3.5 0l4.3 4.3c1 1 1 2.5 0 3.5L10.5 21ZM17 22H7"/></svg>
                        Erase
                    </button>
                    <button id="picker-btn" class="tool-btn">
                        <svg viewBox="0 0 24 24"><path d="m15 11-8.5 8.5H3v-3.5L11.5 7.5Zm0 0 3.5-3.5L20 9l-3.5 3.5ZM6 16l1.5 1.5"/></svg>
                        Pick
                    </button>
                    <button id="bucket-btn" class="tool-btn">
                        <svg viewBox="0 0 24 24"><path d="m19 11-8-8-8.15 8.15a2 2 0 0 0-.05 2.77l5.3 5.3a2 2 0 0 0 2.83 0L19 11Z"/><path d="m5 17 3-3"/><path d="M12 3a9 9 0 0 1 9 9"/></svg>
                        Fill
                    </button>
                    <button id="pan-btn" class="tool-btn" style="grid-column: span 2;">
                        <svg viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v5"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/><path d="M6 14V11a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v9a9 9 0 0 0 9 9h1a8 8 0 0 0 8-8v-3a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v4"/></svg>
                        Pan Canvas
                    </button>
                </div>
            </div>

            <div>
                <div class="section-title">Image to Pixels</div>
                <div class="control-group">
                    <button id="convert-upload-trigger" style="width: 100%; border-radius: var(--radius-sm); background: #fafafa;">
                        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                        Import & Convert
                    </button>
                    <input type="file" id="convert-upload" accept="image/*" style="display: none;">
                    
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="convert-match-palette" checked>
                        Constrain to Palette
                    </label>
                </div>
            </div>

            <div>
                <div class="section-title">Reference</div>
                <div class="control-group">
                    <button id="grid-toggle-btn" style="width: 100%; border-radius: var(--radius-sm); background: #fafafa;">
                        Toggle Grid Lines
                    </button>
                    
                    <button id="upload-trigger-btn" style="width: 100%; border-radius: var(--radius-sm); background: #fafafa; margin-top: 8px;">
                        <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><polygon points="22 19 2 19 4 10 20 10 22 19"/></svg>
                        Set Background
                    </button>
                    <input type="file" id="bg-upload" accept="image/*" style="display: none;">
                    
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
                        <label style="margin:0;">Opacity</label>
                        <span id="opacity-val" style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">0.5</span>
                    </div>
                    <input type="range" id="bg-opacity" min="0" max="1" step="0.1" value="0.5">
                    <button id="bg-remove-btn" class="danger-btn" style="width: 100%; display: none;">Remove Background</button>
                </div>
            </div>

            <button id="clear-btn" class="danger-btn" style="margin-top: auto;">
                <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                Clear Canvas
            </button>
        </div>

        <!-- Center Canvas -->
        <div class="editor-viewport" id="editor-viewport">
            <div id="canvas-transform-container">
                <canvas id="pixel-canvas"></canvas>
            </div>

            <div class="status-bar">
                <span id="zoom-text">Zoom: 100%</span>
                <span style="display: flex; align-items: center; gap: 6px; color: var(--text-muted);">
                    <svg viewBox="0 0 24 24" style="width:14px; height:14px;"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A5 5 0 0 0 8 8c0 1 .3 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><line x1="9" y1="18" x2="15" y2="18"/><line x1="10" y1="22" x2="14" y2="22"/></svg>
                    Scroll to zoom, drag to pan
                </span>
            </div>
        </div>

        <!-- Right Sidebar -->
        <div class="sidebar" style="width: 300px;">
            <div>
                <div class="section-title">Color Palette</div>
                <div class="control-group">
                    <div class="color-picker-wrapper">
                        <input type="color" id="color-picker" value="#000000">
                        <div>
                            <div id="color-hex" style="font-weight: 700; font-size: 1rem; letter-spacing: 1px;">#000000</div>
                            <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 500;">Active Color</div>
                        </div>
                    </div>
                    <div class="palette-grid" id="palette-grid">
                        <!-- Filled by JS -->
                    </div>
                </div>
            </div>

            <div style="flex:1; display:flex; flex-direction:column; min-height: 0;">
                <div class="section-title">Usage Stats</div>
                <div class="stats-list" id="stats-list">
                    <!-- Filled by JS -->
                </div>
            </div>
        </div>
    </div>

    <canvas id="export-canvas" style="display: none;"></canvas>

    <script>
        const canvas = document.getElementById('pixel-canvas');
        const ctx = canvas.getContext('2d');
        const rowsInput = document.getElementById('grid-rows');
        const colsInput = document.getElementById('grid-cols');
        const colorPicker = document.getElementById('color-picker');
        const colorHexText = document.getElementById('color-hex');
        const resizeBtn = document.getElementById('resize-btn');
        const clearBtn = document.getElementById('clear-btn');
        const exportBtn = document.getElementById('export-btn');
        const gridToggleBtn = document.getElementById('grid-toggle-btn');
        const paletteGrid = document.getElementById('palette-grid');
        const statsList = document.getElementById('stats-list');
        
        const pencilBtn = document.getElementById('pencil-btn');
        const eraserBtn = document.getElementById('eraser-btn');
        const pickerBtn = document.getElementById('picker-btn');
        const bucketBtn = document.getElementById('bucket-btn');
        const panBtn = document.getElementById('pan-btn');
        
        const undoBtn = document.getElementById('undo-btn');
        const redoBtn = document.getElementById('redo-btn');
        const centerBtn = document.getElementById('center-btn');

        const bgUpload = document.getElementById('bg-upload');
        const uploadTriggerBtn = document.getElementById('upload-trigger-btn');
        const bgOpacity = document.getElementById('bg-opacity');
        const opacityValText = document.getElementById('opacity-val');
        const bgRemoveBtn = document.getElementById('bg-remove-btn');

        const convertUpload = document.getElementById('convert-upload');
        const convertUploadTrigger = document.getElementById('convert-upload-trigger');
        const convertMatchPalette = document.getElementById('convert-match-palette');

        const viewport = document.getElementById('editor-viewport');
        const transformContainer = document.getElementById('canvas-transform-container');
        const zoomText = document.getElementById('zoom-text');

        // Dimensions configurations
        const cellSize = 24;
        const rulerSize = 30;
        let showGrid = true;

        let logicalWidth = 0;
        let logicalHeight = 0;

        let gridData = []; // Flat array of colors
        let isDrawing = false;
        let isPanning = false;
        let currentMode = 'pencil';
        
        let scale = 1.0;
        let panX = 50;
        let panY = 50;
        let startX = 0, startY = 0;
        let bgImg = null;

        // Mobile pinch variables
        let initialTouchDist = 0;
        let initialTouchScale = 1;

        const classicColors = [
            '#000000', '#ffffff', '#7f7f7f', '#c3c3c3', '#880015', '#ed1c24',
            '#ff7f27', '#fff200', '#22b14c', '#00a2e8', '#3f48cc', '#a349a4',
            '#b97a57', '#ffaec9', '#ffca18', '#b5e61d', '#99d9ea', '#7092be'
        ];

        let history = [];
        let historyStep = -1;

        function updateTransform() {
            transformContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            zoomText.textContent = `Zoom: ${Math.round(scale * 100)}%`;
        }

        function centerCanvas() {
            const viewportRect = viewport.getBoundingClientRect();
            
            scale = Math.min((viewportRect.width - 120) / logicalWidth, (viewportRect.height - 120) / logicalHeight, 1.8);
            scale = Math.max(scale, 0.4);

            panX = (viewportRect.width - logicalWidth * scale) / 2;
            panY = (viewportRect.height - logicalHeight * scale) / 2;

            updateTransform();
        }

        function resizeCanvas() {
            const rows = parseInt(rowsInput.value);
            const cols = parseInt(colsInput.value);
            const gap = showGrid ? 1 : 0;
            
            logicalWidth = rulerSize + cols * cellSize + (cols - 1) * gap;
            logicalHeight = rulerSize + rows * cellSize + (rows - 1) * gap;

            // Resolve High DPI blurring by factoring in device pixel ratio
            const dpr = window.devicePixelRatio || 1;
            canvas.width = logicalWidth * dpr;
            canvas.height = logicalHeight * dpr;
            canvas.style.width = logicalWidth + 'px';
            canvas.style.height = logicalHeight + 'px';

            // Apply standard crisp rendering properties to context
            ctx.resetTransform();
            ctx.scale(dpr, dpr);
            
            ctx.imageSmoothingEnabled = false;
            ctx.mozImageSmoothingEnabled = false;
            ctx.webkitImageSmoothingEnabled = false;
            ctx.msImageSmoothingEnabled = false;
        }

        function drawCanvas() {
            ctx.clearRect(0, 0, logicalWidth, logicalHeight);

            const rows = parseInt(rowsInput.value);
            const cols = parseInt(colsInput.value);
            const gap = showGrid ? 1 : 0;

            // 1. Draw Reference Background if any
            if (bgImg) {
                ctx.save();
                ctx.globalAlpha = parseFloat(bgOpacity.value);
                const activeW = cols * cellSize + (cols - 1) * gap;
                const activeH = rows * cellSize + (rows - 1) * gap;
                ctx.drawImage(bgImg, rulerSize, rulerSize, activeW, activeH);
                ctx.restore();
            }

            // 2. Draw Active Canvas Area Background (if grid is enabled)
            if (showGrid) {
                ctx.fillStyle = '#d4d4d8';
                ctx.fillRect(rulerSize, rulerSize, logicalWidth - rulerSize, logicalHeight - rulerSize);
            }

            // 3. Draw Beads/Cells
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const idx = r * cols + c;
                    const cellColor = gridData[idx] || '#ffffff';
                    const cellX = rulerSize + c * (cellSize + gap);
                    const cellY = rulerSize + r * (cellSize + gap);

                    if (showGrid) {
                        // Bead aesthetic
                        const radius = cellSize / 2;
                        const centerX = cellX + radius;
                        const centerY = cellY + radius;

                        // Base fill
                        if (cellColor.toLowerCase() === '#ffffff' && bgImg) {
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                        } else {
                            ctx.fillStyle = cellColor;
                        }
                        ctx.beginPath();
                        ctx.arc(centerX, centerY, radius - 1, 0, 2 * Math.PI);
                        ctx.fill();

                        // Bead center shading
                        ctx.beginPath();
                        ctx.arc(centerX, centerY, 2.5, 0, 2 * Math.PI);
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
                        ctx.fill();
                    } else {
                        // Square flat aesthetic
                        ctx.fillStyle = cellColor;
                        ctx.fillRect(cellX, cellY, cellSize, cellSize);
                    }
                }
            }

            // 4. Draw Ruler overlay on top edges
            ctx.fillStyle = '#fafafa';
            ctx.fillRect(0, 0, rulerSize, logicalHeight); // Left ruler
            ctx.fillRect(0, 0, logicalWidth, rulerSize); // Top ruler

            // Borders separating ruler and drawing area
            ctx.strokeStyle = '#d4d4d8';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(rulerSize - 0.5, 0);
            ctx.lineTo(rulerSize - 0.5, logicalHeight);
            ctx.moveTo(0, rulerSize - 0.5);
            ctx.lineTo(logicalWidth, rulerSize - 0.5);
            ctx.stroke();

            // Ruler Labels
            ctx.fillStyle = '#71717a';
            ctx.font = 'bold 10px Inter, -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            for (let c = 0; c < cols; c++) {
                const x = rulerSize + c * (cellSize + gap) + cellSize / 2;
                ctx.fillText((c + 1).toString(), x, rulerSize / 2);
            }

            for (let r = 0; r < rows; r++) {
                const y = rulerSize + r * (cellSize + gap) + cellSize / 2;
                ctx.fillText((r + 1).toString(), rulerSize / 2, y);
            }
        }

        function getCellCoords(e) {
            const rect = canvas.getBoundingClientRect();
            // Maps logical position based on logical size and scaled dimensions
            const x = (e.clientX - rect.left) * (logicalWidth / rect.width);
            const y = (e.clientY - rect.top) * (logicalHeight / rect.height);
            const gap = showGrid ? 1 : 0;
            
            if (x < rulerSize || y < rulerSize) return null;

            const cols = parseInt(colsInput.value);
            const rows = parseInt(rowsInput.value);
            const col = Math.floor((x - rulerSize) / (cellSize + gap));
            const row = Math.floor((y - rulerSize) / (cellSize + gap));

            if (col >= 0 && col < cols && row >= 0 && row < rows) {
                return { col, row, index: row * cols + col };
            }
            return null;
        }

        function getTouchCoords(touch) {
            const rect = canvas.getBoundingClientRect();
            const x = (touch.clientX - rect.left) * (logicalWidth / rect.width);
            const y = (touch.clientY - rect.top) * (logicalHeight / rect.height);
            const gap = showGrid ? 1 : 0;
            
            if (x < rulerSize || y < rulerSize) return null;

            const cols = parseInt(colsInput.value);
            const rows = parseInt(rowsInput.value);
            const col = Math.floor((x - rulerSize) / (cellSize + gap));
            const row = Math.floor((y - rulerSize) / (cellSize + gap));

            if (col >= 0 && col < cols && row >= 0 && row < rows) {
                return { col, row, index: row * cols + col };
            }
            return null;
        }

        function initGrid() {
            const rows = parseInt(rowsInput.value);
            const cols = parseInt(colsInput.value);

            gridData = Array(rows * cols).fill('#ffffff');

            resizeCanvas();
            history = [];
            historyStep = -1;
            saveHistory();
            updateStats();
            drawCanvas();
            setTimeout(centerCanvas, 50);
        }

        // Interactivity Viewport - Scaled bounds from 1% to 10000%
        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 1.1;
            const prevScale = scale;

            if (e.deltaY < 0) {
                scale = Math.min(scale * zoomFactor, 100.0); // 10000% Max
            } else {
                scale = Math.max(scale / zoomFactor, 0.01);  // 1% Min
            }

            const rect = viewport.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            panX = mouseX - (mouseX - panX) * (scale / prevScale);
            panY = mouseY - (mouseY - panY) * (scale / prevScale);

            updateTransform();
        }, { passive: false });

        viewport.addEventListener('mousedown', (e) => {
            if (e.button === 1 || currentMode === 'pan') {
                isPanning = true;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
                viewport.classList.add('active-grabbing');
                e.preventDefault();
            }
        });

        // Event listener mapping for Drawing Area
        canvas.addEventListener('mousedown', (e) => {
            if (currentMode === 'pan' || e.button === 1) return;
            e.preventDefault();

            const coords = getCellCoords(e);
            if (!coords) return;

            if (currentMode === 'picker') {
                pickColor(coords.index);
            } else if (currentMode === 'bucket') {
                fillBucket(coords.index);
            } else {
                isDrawing = true;
                colorCellAtIndex(coords.index);
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing && (currentMode === 'pencil' || currentMode === 'eraser')) {
                const coords = getCellCoords(e);
                if (coords) {
                    colorCellAtIndex(coords.index);
                }
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                updateTransform();
            }
        });

        window.addEventListener('mouseup', () => {
            if (isPanning) {
                isPanning = false;
                viewport.classList.remove('active-grabbing');
            }
            if (isDrawing) {
                isDrawing = false;
                saveHistory();
            }
        });

        // Touch handling with Pinch-to-Zoom
        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                isPanning = true;
                const touch1 = e.touches[0];
                const touch2 = e.touches[1];
                
                // Track finger distance for pinching
                const dx = touch1.clientX - touch2.clientX;
                const dy = touch1.clientY - touch2.clientY;
                initialTouchDist = Math.sqrt(dx * dx + dy * dy);
                initialTouchScale = scale;

                startX = (touch1.clientX + touch2.clientX) / 2 - panX;
                startY = (touch1.clientY + touch2.clientY) / 2 - panY;
            } else if (currentMode === 'pan') {
                isPanning = true;
                startX = e.touches[0].clientX - panX;
                startY = e.touches[0].clientY - panY;
            } else if (e.touches.length === 1) {
                const coords = getTouchCoords(e.touches[0]);
                if (coords) {
                    isDrawing = true;
                    if (currentMode === 'picker') {
                        pickColor(coords.index);
                    } else if (currentMode === 'bucket') {
                        fillBucket(coords.index);
                    } else {
                        colorCellAtIndex(coords.index);
                    }
                }
            }
        });

        viewport.addEventListener('touchmove', (e) => {
            if (isPanning) {
                e.preventDefault();
                if (e.touches.length === 2) {
                    const touch1 = e.touches[0];
                    const touch2 = e.touches[1];
                    
                    const dx = touch1.clientX - touch2.clientX;
                    const dy = touch1.clientY - touch2.clientY;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (initialTouchDist > 0) {
                        const prevScale = scale;
                        const factor = dist / initialTouchDist;
                        scale = initialTouchScale * factor;
                        
                        // Limit within expanded boundaries (1% to 10000%)
                        scale = Math.min(Math.max(scale, 0.01), 100.0);

                        const rect = viewport.getBoundingClientRect();
                        const midX = (touch1.clientX + touch2.clientX) / 2 - rect.left;
                        const midY = (touch1.clientY + touch2.clientY) / 2 - rect.top;

                        panX = midX - (midX - panX) * (scale / prevScale);
                        panY = midY - (midY - panY) * (scale / prevScale);
                    }

                    const currentMidX = (touch1.clientX + touch2.clientX) / 2;
                    const currentMidY = (touch1.clientY + touch2.clientY) / 2;
                    startX = currentMidX - panX;
                    startY = currentMidY - panY;
                } else {
                    panX = e.touches[0].clientX - startX;
                    panY = e.touches[0].clientY - startY;
                }
                updateTransform();
            } else if (isDrawing && (currentMode === 'pencil' || currentMode === 'eraser') && e.touches.length === 1) {
                const coords = getTouchCoords(e.touches[0]);
                if (coords) {
                    colorCellAtIndex(coords.index);
                }
            }
        });

        viewport.addEventListener('touchend', () => {
            isPanning = false;
            if (isDrawing) {
                isDrawing = false;
                saveHistory();
            }
        });

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return { r, g, b };
        }

        function rgbToHex(r, g, b) {
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toLowerCase();
        }

        function findNearestClassicColor(r, g, b, rgbList) {
            let minDistance = Infinity;
            let nearestHex = '#ffffff';
            for (let i = 0; i < classicColors.length; i++) {
                const cRgb = rgbList[i];
                const dist = Math.pow(r - cRgb.r, 2) + Math.pow(g - cRgb.g, 2) + Math.pow(b - cRgb.b, 2);
                if (dist < minDistance) {
                    minDistance = dist;
                    nearestHex = classicColors[i];
                }
            }
            return nearestHex;
        }

        function convertImageToBeads(img) {
            const rows = parseInt(rowsInput.value);
            const cols = parseInt(colsInput.value);

            const offCanvas = document.createElement('canvas');
            offCanvas.width = cols;
            offCanvas.height = rows;
            const offCtx = offCanvas.getContext('2d');

            offCtx.drawImage(img, 0, 0, cols, rows);

            const imgData = offCtx.getImageData(0, 0, cols, rows);
            const data = imgData.data;

            const classicRgbList = classicColors.map(hexToRgb);

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const pixelIndex = (r * cols + c) * 4;
                    const red = data[pixelIndex];
                    const green = data[pixelIndex + 1];
                    const blue = data[pixelIndex + 2];
                    const alpha = data[pixelIndex + 3];

                    const cellIndex = r * cols + c;
                    let finalColor = '#ffffff';

                    if (alpha >= 128) {
                        if (convertMatchPalette.checked) {
                            finalColor = findNearestClassicColor(red, green, blue, classicRgbList);
                        } else {
                            finalColor = rgbToHex(red, green, blue);
                        }
                    }
                    gridData[cellIndex] = finalColor;
                }
            }
            saveHistory();
            updateStats();
            drawCanvas();
        }

        function colorCellAtIndex(idx) {
            let color = '#ffffff';
            if (currentMode === 'pencil') color = colorPicker.value;
            if (gridData[idx] !== color) {
                gridData[idx] = color;
                updateStats();
                drawCanvas();
            }
        }

        function pickColor(idx) {
            const pickedColor = gridData[idx] || '#ffffff';
            colorPicker.value = pickedColor;
            updateColorHex();
            setActivePaletteHighlight(pickedColor);
            switchTool('pencil');
        }

        function fillBucket(startIndex) {
            const rows = parseInt(rowsInput.value);
            const cols = parseInt(colsInput.value);
            const targetColor = gridData[startIndex] || '#ffffff';
            const replacementColor = colorPicker.value;

            if (targetColor.toLowerCase() === replacementColor.toLowerCase()) return;

            const queue = [startIndex];
            const visited = new Set();
            visited.add(startIndex);

            while (queue.length > 0) {
                const curr = queue.shift();
                const r = Math.floor(curr / cols);
                const c = curr % cols;

                gridData[curr] = replacementColor;

                const directions = [{r: r-1, c: c}, {r: r+1, c: c}, {r: r, c: c-1}, {r: r, c: c+1}];

                for (let d of directions) {
                    if (d.r >= 0 && d.r < rows && d.c >= 0 && d.c < cols) {
                        const nextIdx = d.r * cols + d.c;
                        if (!visited.has(nextIdx) && (gridData[nextIdx] || '#ffffff') === targetColor) {
                            visited.add(nextIdx);
                            queue.push(nextIdx);
                        }
                    }
                }
            }
            saveHistory();
            updateStats();
            drawCanvas();
        }

        function saveHistory() {
            const state = [...gridData];
            if (historyStep < history.length - 1) {
                history = history.slice(0, historyStep + 1);
            }
            history.push(state);
            if (history.length > 50) history.shift();
            historyStep = history.length - 1;
            updateHistoryButtons();
        }

        function undo() {
            if (historyStep > 0) {
                historyStep--;
                restoreState(history[historyStep]);
            }
        }

        function redo() {
            if (historyStep < history.length - 1) {
                historyStep++;
                restoreState(history[historyStep]);
            }
        }

        function restoreState(state) {
            gridData = [...state];
            updateStats();
            updateHistoryButtons();
            drawCanvas();
        }

        function updateHistoryButtons() {
            undoBtn.disabled = historyStep <= 0;
            redoBtn.disabled = historyStep >= history.length - 1;
            undoBtn.style.opacity = undoBtn.disabled ? 0.4 : 1;
            redoBtn.style.opacity = redoBtn.disabled ? 0.4 : 1;
        }

        undoBtn.addEventListener('click', undo);
        redoBtn.addEventListener('click', redo);
        centerBtn.addEventListener('click', centerCanvas);

        function switchTool(mode) {
            currentMode = mode;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            viewport.classList.remove('active-drawing');
            
            if (mode === 'pencil') { pencilBtn.classList.add('active'); viewport.classList.add('active-drawing'); }
            else if (mode === 'eraser') { eraserBtn.classList.add('active'); viewport.classList.add('active-drawing'); }
            else if (mode === 'picker') { pickerBtn.classList.add('active'); }
            else if (mode === 'bucket') { bucketBtn.classList.add('active'); }
            else if (mode === 'pan') { panBtn.classList.add('active'); }
        }

        pencilBtn.addEventListener('click', () => switchTool('pencil'));
        eraserBtn.addEventListener('click', () => switchTool('eraser'));
        pickerBtn.addEventListener('click', () => switchTool('picker'));
        bucketBtn.addEventListener('click', () => switchTool('bucket'));
        panBtn.addEventListener('click', () => switchTool('pan'));

        function toggleGrid() {
            showGrid = !showGrid;
            if (!showGrid) {
                gridToggleBtn.textContent = 'Show Grid Lines';
                canvas.style.borderRadius = '0';
            } else {
                gridToggleBtn.textContent = 'Hide Grid Lines';
                canvas.style.borderRadius = '4px';
            }
            resizeCanvas();
            drawCanvas();
        }
        gridToggleBtn.addEventListener('click', toggleGrid);

        function initPalette() {
            paletteGrid.innerHTML = '';
            classicColors.forEach(color => {
                const item = document.createElement('div');
                item.className = 'palette-color';
                item.style.backgroundColor = color;
                item.dataset.color = color;
                
                if (color.toLowerCase() === colorPicker.value.toLowerCase()) {
                    item.classList.add('active');
                }

                item.addEventListener('click', () => {
                    colorPicker.value = color;
                    updateColorHex();
                    setActivePaletteHighlight(color);
                    switchTool('pencil');
                });
                paletteGrid.appendChild(item);
            });
        }

        function setActivePaletteHighlight(activeColor) {
            document.querySelectorAll('.palette-color').forEach(item => {
                if (item.dataset.color.toLowerCase() === activeColor.toLowerCase()) item.classList.add('active');
                else item.classList.remove('active');
            });
        }

        function updateColorHex() { colorHexText.textContent = colorPicker.value.toUpperCase(); }

        colorPicker.addEventListener('input', () => {
            updateColorHex();
            setActivePaletteHighlight(colorPicker.value);
            switchTool('pencil');
        });

        function updateStats() {
            const counts = {};

            gridData.forEach(color => {
                const lower = color.toLowerCase();
                if (lower !== '#ffffff') counts[lower] = (counts[lower] || 0) + 1;
            });

            statsList.innerHTML = '';
            const sortedColors = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);

            if (sortedColors.length === 0) {
                statsList.innerHTML = '<div style="color: var(--text-muted); font-size: 0.85rem; padding: 12px; text-align: center;">Canvas is empty</div>';
                return;
            }

            sortedColors.forEach(color => {
                const item = document.createElement('div');
                item.className = 'stats-item';
                item.innerHTML = `
                    <div style="display: flex; align-items: center;">
                        <span class="stats-color-preview" style="background-color: ${color};"></span>
                        <span>${color.toUpperCase()}</span>
                    </div>
                    <span style="color: var(--text-muted);">${counts[color]} px</span>
                `;

                item.addEventListener('click', () => {
                    colorPicker.value = color;
                    updateColorHex();
                    setActivePaletteHighlight(color);
                    switchTool('pencil');
                });

                statsList.appendChild(item);
            });
        }

        uploadTriggerBtn.addEventListener('click', () => bgUpload.click());
        bgUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        bgImg = img;
                        bgRemoveBtn.style.display = 'block';
                        drawCanvas();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        bgRemoveBtn.addEventListener('click', () => {
            bgImg = null;
            bgUpload.value = '';
            bgRemoveBtn.style.display = 'none';
            drawCanvas();
        });

        bgOpacity.addEventListener('input', (e) => {
            const val = e.target.value;
            opacityValText.textContent = val;
            drawCanvas();
        });

        convertUploadTrigger.addEventListener('click', () => convertUpload.click());
        convertUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                if (confirm('Convert image? Current canvas will be overwritten.')) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => convertImageToBeads(img);
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
                convertUpload.value = '';
            }
        });

        clearBtn.addEventListener('click', () => {
            if (confirm('Clear canvas? This cannot be undone.')) {
                gridData.fill('#ffffff');
                saveHistory();
                updateStats();
                drawCanvas();
            }
        });

        resizeBtn.addEventListener('click', () => {
            if (confirm('Changing size clears the canvas. Continue?')) {
                initGrid();
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z' || e.key === 'Z') { e.preventDefault(); undo(); }
                else if (e.key === 'y' || e.key === 'Y') { e.preventDefault(); redo(); }
            }
            if (e.key === 'p' || e.key === 'P') switchTool('pencil');
            if (e.key === 'e' || e.key === 'E') switchTool('eraser');
            if (e.key === 'i' || e.key === 'I') switchTool('picker');
            if (e.key === 'g' || e.key === 'G') toggleGrid();
            if (e.key === 'h' || e.key === 'H') switchTool('pan');
        });

        exportBtn.addEventListener('click', () => {
            const rows = parseInt(rowsInput.value);
            const cols = parseInt(colsInput.value);
            const exportCanvas = document.getElementById('export-canvas');
            const exportCtx = exportCanvas.getContext('2d');

            const exportCellSize = 32; 
            const lineWidth = 2;       
            const rulerOffset = 40; 

            exportCanvas.width = cols * exportCellSize + (cols + 1) * lineWidth + rulerOffset;
            exportCanvas.height = rows * exportCellSize + (rows + 1) * lineWidth + rulerOffset;

            exportCtx.fillStyle = '#ffffff';
            exportCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

            exportCtx.font = 'bold 12px Inter, sans-serif';
            exportCtx.textAlign = 'center';
            exportCtx.textBaseline = 'middle';

            for (let c = 0; c < cols; c++) {
                const x = rulerOffset + lineWidth + c * (exportCellSize + lineWidth) + (exportCellSize / 2);
                exportCtx.fillStyle = '#71717a';
                exportCtx.fillText((c + 1).toString(), x, rulerOffset / 2);
            }

            for (let r = 0; r < rows; r++) {
                const y = rulerOffset + lineWidth + r * (exportCellSize + lineWidth) + (exportCellSize / 2);
                exportCtx.fillStyle = '#71717a';
                exportCtx.fillText((r + 1).toString(), rulerOffset / 2, y);
            }

            exportCtx.fillStyle = '#e4e4e7';
            exportCtx.fillRect(rulerOffset, rulerOffset, exportCanvas.width - rulerOffset, exportCanvas.height - rulerOffset);

            gridData.forEach((beadColor, index) => {
                const r = Math.floor(index / cols);
                const c = index % cols;

                const x = rulerOffset + lineWidth + c * (exportCellSize + lineWidth);
                const y = rulerOffset + lineWidth + r * (exportCellSize + lineWidth);

                const finalColor = beadColor || '#ffffff';

                exportCtx.fillStyle = finalColor;
                exportCtx.beginPath();
                const radius = exportCellSize / 2;
                exportCtx.arc(x + radius, y + radius, radius - 1, 0, 2 * Math.PI);
                exportCtx.fill();

                exportCtx.beginPath();
                exportCtx.arc(x + radius, y + radius, 2.5, 0, 2 * Math.PI);
                exportCtx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                exportCtx.fill();
            });

            const link = document.createElement('a');
            link.download = `pixelart_${cols}x${rows}.png`;
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
        });

        // Initialize
        initPalette();
        updateColorHex();
        initGrid();
        switchTool('pencil');
    </script>
</body>
</html>
